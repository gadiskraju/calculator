<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        /* Center the calculator on the page */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Calculator Container */
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
        }

        /* Output Screen */
        .display {
            width: 100%;
            height: 50px;
            background-color: #fff;
            font-size: 24px;
            text-align: right;
            padding: 5px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* Button Grid Layout */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Individual Button Styling */
        input[type="button"] {
            height: 50px;
            font-size: 20px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Hover effect for buttons */
        input[type="button"]:hover {
            background-color: #d4d4d4;
        }

        /* Operator specific styling */
        .operator {
            background-color: #ff9500 !important;
            color: white;
        }

        .operator:hover {
            background-color: #e08500 !important;
        }

        /* Clear button styling */
        .clear {
            background-color: #ff3b30 !important;
            color: white;
        }

        .clear:hover {
            background-color: #d32f2f !important;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Form wrapper to allow easy access to input field by name -->
    <form name="calc">
        <!-- Calculator Display Screen -->
        <input type="text" class="display" name="display" readonly>
        
        <!-- Calculator Buttons -->
        <div class="buttons">
            <input type="button" class="clear" value="C" onclick="calc.display.value = ''">
            <input type="button" value="⌫" onclick="calc.display.value = calc.display.value.toString().slice(0, -1)">
            <input type="button" value="%" onclick="calc.display.value += '%'">
            <input type="button" class="operator" value="/" onclick="calc.display.value += '/'">

            <input type="button" value="7" onclick="calc.display.value += '7'">
            <input type="button" value="8" onclick="calc.display.value += '8'">
            <input type="button" value="9" onclick="calc.display.value += '9'">
            <input type="button" class="operator" value="*" onclick="calc.display.value += '*'">

            <input type="button" value="4" onclick="calc.display.value += '4'">
            <input type="button" value="5" onclick="calc.display.value += '5'">
            <input type="button" value="6" onclick="calc.display.value += '6'">
            <input type="button" class="operator" value="-" onclick="calc.display.value += '-'">

            <input type="button" value="1" onclick="calc.display.value += '1'">
            <input type="button" value="2" onclick="calc.display.value += '2'">
            <input type="button" value="3" onclick="calc.display.value += '3'">
            <input type="button" class="operator" value="+" onclick="calc.display.value += '+'">

            <input type="button" value="0" onclick="calc.display.value += '0'">
            <input type="button" value="." onclick="calc.display.value += '.'">
            <!-- The equal button evaluates the expression string inside the text box -->
            <input type="button" class="operator" style="grid-column: span 2;" value="=" onclick="calc.display.value = eval(calc.display.value)">
        </div>
    </form>
</div>

</body>
</html>
